<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mastery · 60 Day Prep</title>
<meta name="theme-color" content="#ffffff">
<script>
(function () {
  var t = null; try { t = localStorage.getItem("sdp-theme"); } catch (e) {}
  if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  document.documentElement.dataset.theme = t;
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root {
  color-scheme: light;
  --bg: #f5f8fc; --card: #ffffff; --line: #e2e8f0; --line-2: #eef2f7; --fg: #0f1d33; --muted: #64748b; --faint: #94a3b8;
  --blue: #2563eb; --blue-soft: #dbeafe; --blue-ink: #1e40af;
  --easy: #15803d; --easy-bg: #dcfce7; --med: #b45309; --med-bg: #fef3c7; --hard: #b91c1c; --hard-bg: #fee2e2;
  --purple: #7c3aed; --purple-bg: #ede9fe;
  --code-bg: #f8fafc; --strong: #cbd5e1; --shadow: rgba(15, 29, 51, .12);
  --sans: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0b0c14; --card: #0f101a; --line: rgba(147, 157, 184, .13); --line-2: rgba(147, 157, 184, .08); --fg: #f1f3f9; --muted: #939db8; --faint: #6b7390;
  --blue: #7c87f7; --blue-soft: rgba(124, 135, 247, .14); --blue-ink: #c7ccff;
  --easy: #4ade80; --easy-bg: rgba(74, 222, 128, .08); --med: #fbbf24; --med-bg: rgba(251, 191, 36, .08); --hard: #f87171; --hard-bg: rgba(248, 113, 113, .08);
  --purple: #c4b5fd; --purple-bg: rgba(196, 181, 253, .08);
  --code-bg: #0d0e17; --strong: rgba(147, 157, 184, .3); --shadow: rgba(0, 0, 0, .5);
}
:root[data-theme="dark"] body { background: radial-gradient(900px 380px at 50% -160px, rgba(124, 135, 247, .18), transparent 70%) no-repeat, var(--bg); }
:root[data-theme="dark"] header { background: rgba(11, 12, 20, .78); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom-color: var(--line-2); }
:root[data-theme="dark"] .doc h1 .tt { background: linear-gradient(180deg, #fff 30%, #9aa3c0); -webkit-background-clip: text; background-clip: text; color: transparent; }
:root[data-theme="dark"] .eyebrow { color: var(--blue); }
:root[data-theme="dark"] .prog div { background: linear-gradient(90deg, #5b63d3, #7c87f7); }
:root[data-theme="dark"] .md pre .lang { color: var(--muted); }
* { box-sizing: border-box; }
html { scroll-padding-top: 72px; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.65 var(--sans); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--card); }
a { color: var(--blue); }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
[hidden] { display: none !important; }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--card); border-bottom: 1px solid var(--line); }
.hbar { display: flex; align-items: center; gap: 14px; padding-block: 12px; }
.brand { font-weight: 800; font-size: 18px; letter-spacing: -.01em; color: var(--fg); text-decoration: none; }
.brand span { color: var(--blue); }
.crumb { font-size: 14px; color: var(--muted); font-weight: 600; }
.hmeta { margin-left: auto; display: flex; align-items: center; gap: 12px; }
.back { font-size: 13px; font-weight: 600; text-decoration: none; padding: 5px 12px; border-radius: 999px; border: 1px solid var(--line); color: var(--fg); white-space: nowrap; }
.back:hover { border-color: var(--strong); }
.brand { white-space: nowrap; }
@media (max-width: 520px) { .crumb { display: none; } .back span { display: none; } .hbar { gap: 10px; } }
.theme-btn { flex-shrink: 0; width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--line); background: var(--card); display: grid; place-items: center; padding: 0; font-size: 15px; line-height: 1; }
main { display: grid; grid-template-columns: 290px minmax(0, 1fr); gap: 22px; padding-block: 20px 60px; align-items: start; }
@media (max-width: 900px) { main { grid-template-columns: minmax(0, 1fr); } }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; }
.side { position: sticky; top: 76px; padding: 16px; max-height: calc(100vh - 96px); overflow: auto; }
@media (max-width: 900px) { .side { position: static; max-height: none; } }
.lvl-h { display: flex; align-items: baseline; gap: 8px; margin: 0 0 2px; }
.lvl-h b { font: 700 12px var(--mono); color: var(--blue-ink); background: var(--blue-soft); padding: 2px 9px; border-radius: 999px; }
.lvl-h span { font-weight: 800; font-size: 16px; }
.lvl-blurb { font-size: 13px; color: var(--muted); margin: 4px 0 10px; }
.prog { height: 6px; border-radius: 999px; background: var(--line-2); overflow: hidden; margin-bottom: 4px; }
.prog div { height: 100%; background: var(--easy); transition: width .25s; }
.prog-t { font-size: 12px; color: var(--muted); margin-bottom: 12px; font-variant-numeric: tabular-nums; }
.topic { display: grid; grid-template-columns: 26px minmax(0, 1fr) 20px; gap: 8px; align-items: center; width: 100%; text-align: left; padding: 9px 10px; border-radius: 10px; border: 1px solid transparent; background: none; margin-bottom: 4px; }
.topic:hover { background: var(--bg); }
.topic[aria-current="true"] { background: var(--blue-soft); border-color: var(--blue); }
.topic .ic { font-size: 18px; text-align: center; }
.topic .nm { font-weight: 700; font-size: 14px; }
.topic .ok { color: var(--easy); font-weight: 800; text-align: center; }
.soon { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line-2); font-size: 12px; color: var(--faint); }
.doc { padding: 26px 30px 34px; min-width: 0; }
@media (max-width: 600px) { .doc { padding: 18px 16px 26px; } }
.doc-top { display: flex; gap: 14px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; }
.eyebrow { font: 600 12px var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.doc h1 { font-size: 28px; line-height: 1.2; letter-spacing: -.02em; margin: 4px 0 6px; }
.doc .sum { color: var(--muted); margin: 0; max-width: 62ch; }
.done-btn { border: 1.5px solid var(--line); background: var(--card); border-radius: 999px; padding: 7px 14px; font-weight: 700; font-size: 14px; white-space: nowrap; }
.done-btn[aria-pressed="true"] { background: var(--easy-bg); border-color: var(--easy); color: var(--easy); }
.meta-row { display: flex; gap: 10px; flex-wrap: wrap; margin: 12px 0 0; font-size: 12px; color: var(--muted); }
.meta-row span { background: var(--bg); border: 1px solid var(--line-2); padding: 2px 10px; border-radius: 999px; }
.toc { margin: 20px 0 6px; padding: 14px 16px; border-radius: 12px; background: var(--bg); border: 1px solid var(--line-2); }
.toc b { display: block; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 6px; }
.toc ol { margin: 0; padding-left: 20px; columns: 2; column-gap: 28px; font-size: 14px; }
@media (max-width: 600px) { .toc ol { columns: 1; } }
.toc li { break-inside: avoid; padding: 1px 0; }
.toc a { text-decoration: none; }
.toc a:hover { text-decoration: underline; }
.md { overflow-wrap: anywhere; }
.md h2 { font-size: 21px; letter-spacing: -.01em; margin: 34px 0 8px; padding-top: 16px; border-top: 1px solid var(--line-2); }
.md h3 { font-size: 16.5px; margin: 22px 0 6px; }
.md h3.q { font-size: 15.5px; background: var(--blue-soft); color: var(--blue-ink); padding: 8px 12px; border-radius: 10px; }
.md p { margin: 8px 0; }
.md ul, .md ol { margin: 8px 0; padding-left: 22px; }
.md li { margin: 3px 0; }
.md li ul { margin: 3px 0; }
.md code { font: 13px var(--mono); background: var(--code-bg); border: 1px solid var(--line-2); padding: 0 5px; border-radius: 6px; }
.md pre { margin: 12px 0; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--code-bg); overflow-x: auto; font: 13px/1.55 var(--mono); position: relative; }
.md pre code { border: 0; padding: 0; background: none; font: inherit; white-space: pre; }
.md pre .lang { position: absolute; top: 6px; right: 10px; font: 600 10px var(--mono); color: var(--faint); text-transform: uppercase; }
.kt .kw { color: #7c3aed; font-weight: 500; } .kt .str { color: #15803d; } .kt .num { color: #c2410c; } .kt .cm { color: var(--faint); font-style: italic; } .kt .an { color: #b45309; }
:root[data-theme="dark"] .kt .kw { color: #c4b5fd; } :root[data-theme="dark"] .kt .str { color: #86efac; } :root[data-theme="dark"] .kt .num { color: #fdba74; } :root[data-theme="dark"] .kt .an { color: #fcd34d; }
.call { margin: 12px 0; padding: 10px 14px; border-radius: 10px; border-left: 4px solid var(--blue); background: var(--blue-soft); color: var(--fg); }
.call.tip { border-color: var(--easy); background: var(--easy-bg); }
.call.pitfall { border-color: var(--hard); background: var(--hard-bg); }
.call.interview { border-color: var(--purple); background: var(--purple-bg); }
.call.hood { border-color: var(--med); background: var(--med-bg); }
.tbl { overflow-x: auto; margin: 12px 0; border: 1px solid var(--line); border-radius: 12px; }
.md table { border-collapse: collapse; width: 100%; font-size: 14px; }
.md th, .md td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line-2); vertical-align: top; overflow-wrap: normal; min-width: 7.5em; }
.md th { background: var(--bg); font-weight: 700; }
.md tr:last-child td { border-bottom: 0; }
.pager { display: flex; justify-content: space-between; gap: 12px; margin-top: 34px; padding-top: 18px; border-top: 1px solid var(--line); }
.pager button { border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 10px 14px; text-align: left; max-width: 48%; }
.pager button:hover { border-color: var(--blue); }
.pager small { display: block; color: var(--muted); font-size: 12px; }
.pager .nx { margin-left: auto; text-align: right; }
.empty { padding: 40px 10px; text-align: center; color: var(--muted); }
.totop { position: fixed; right: 18px; bottom: 18px; width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--card); box-shadow: 0 6px 20px var(--shadow); font-size: 16px; }
</style>
</head>
<body>
<header>
  <div class="wrap hbar">
    <a class="brand" href="/">60 Day <span>Prep</span></a>
    <span class="crumb">/ Mastery</span>
    <div class="hmeta">
      <a class="back" href="/" aria-label="Back to daily prep">← <span>Daily prep</span></a>
      <button class="theme-btn" data-theme-toggle></button>
    </div>
  </div>
</header>

<div class="wrap">
  <main>
    <nav class="card side" id="side" aria-label="Levels and topics"></nav>
    <article class="card doc" id="doc"><div class="empty">Loading…</div></article>
  </main>
</div>
<button class="totop" id="toTop" aria-label="Back to top" title="Back to top" hidden>↑</button>

<script>
function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  document.querySelector('meta[name="theme-color"]').content = t === "dark" ? "#0b0c14" : "#ffffff";
  document.querySelectorAll("[data-theme-toggle]").forEach(b => {
    b.textContent = t === "dark" ? "☀️" : "🌙";
    b.setAttribute("aria-label", t === "dark" ? "Switch to light mode" : "Switch to dark mode");
    b.title = b.getAttribute("aria-label");
  });
}
applyTheme(document.documentElement.dataset.theme);
document.querySelectorAll("[data-theme-toggle]").forEach(b => b.addEventListener("click", () => {
  const t = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
  try { localStorage.setItem("sdp-theme", t); } catch {}
  applyTheme(t);
}));

const $ = id => document.getElementById(id);
function el(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k.startsWith("on")) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) e.append(c);
  return e;
}

// ---- Kotlin highlighting (same rules as the main app) ----
const KT_RE = /(\/\/[^\n]*|\/\*[\s\S]*?\*\/)|("""[\s\S]*?"""|"(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\])+')|(@[A-Za-z]+)|\b(\d[\d_]*(?:\.\d+)?[LfFuU]?)\b|\b(abstract|annotation|as|break|by|catch|class|companion|const|constructor|continue|crossinline|data|do|else|enum|false|final|finally|for|fun|get|if|import|in|infix|init|inline|inner|interface|internal|is|lateinit|noinline|null|object|open|operator|out|override|package|private|protected|public|reified|return|sealed|set|super|suspend|tailrec|this|throw|true|try|typealias|val|value|var|vararg|when|where|while)\b/g;
function codeBlock(code, lang) {
  const c = el("code");
  if (lang === "kotlin" || lang === "kt" || lang === "java") {
    let last = 0, m;
    KT_RE.lastIndex = 0;
    while ((m = KT_RE.exec(code))) {
      if (m.index > last) c.append(code.slice(last, m.index));
      c.append(el("span", { class: m[1] ? "cm" : m[2] ? "str" : m[3] ? "an" : m[4] ? "num" : "kw" }, m[0]));
      last = KT_RE.lastIndex;
    }
    c.append(code.slice(last));
  } else c.append(code);
  return el("pre", { class: "kt" }, lang ? el("span", { class: "lang", "aria-hidden": "true" }, lang) : null, c);
}

// ---- Tiny Markdown renderer. Builds DOM nodes only, never innerHTML. ----
const INLINE_SRC = /`([^`]+)`|\*\*(.+?)\*\*|\*([^*\s][^*]*?)\*|\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/.source;
function inline(text) {
  // Fresh regex per call: bold/italic recurse, and a shared /g regex would lose its place.
  const INLINE_RE = new RegExp(INLINE_SRC, "g");
  const out = []; let last = 0, m;
  while ((m = INLINE_RE.exec(text))) {
    if (m.index > last) out.push(text.slice(last, m.index));
    if (m[1] != null) out.push(el("code", {}, m[1]));
    else if (m[2] != null) out.push(el("strong", {}, ...inline(m[2])));
    else if (m[3] != null) out.push(el("em", {}, ...inline(m[3])));
    else out.push(el("a", { href: m[5], target: "_blank", rel: "noopener" }, m[4]));
    last = INLINE_RE.lastIndex;
  }
  if (last < text.length) out.push(text.slice(last));
  return out;
}
const slug = s => s.toLowerCase().replace(/`/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
const CALLS = [["Tip:", "tip"], ["Pitfall:", "pitfall"], ["Interview:", "interview"], ["Under the hood:", "hood"], ["Note:", "note"]];
const cells = row => row.trim().replace(/^\||\|$/g, "").split("|").map(s => s.trim());

function renderMarkdown(src) {
  const lines = src.replace(/\r\n?/g, "\n").split("\n");
  const root = el("div", { class: "md" }), toc = [], used = {};
  let i = 0, para = [];
  const flush = () => { if (para.length) { root.append(el("p", {}, ...inline(para.join(" ")))); para = []; } };
  const isBlockStart = l => /^(#{1,3} |```|> |\s*[-*] |\d+\. |\|)/.test(l);
  while (i < lines.length) {
    const line = lines[i];
    if (!line.trim()) { flush(); i++; continue; }
    let m;
    if ((m = line.match(/^```\s*([\w+-]*)/))) {
      flush(); const lang = m[1].toLowerCase(), buf = []; i++;
      while (i < lines.length && !/^```\s*$/.test(lines[i])) buf.push(lines[i++]);
      i++; root.append(codeBlock(buf.join("\n"), lang)); continue;
    }
    if ((m = line.match(/^(#{1,3}) (.+)$/))) {
      flush(); const lvl = Math.max(2, m[1].length), text = m[2].trim();
      const q = /^Q:\s*/.test(text);
      let id = slug(text) || "s"; if (used[id]) id += "-" + (++used[id]); else used[id] = 1;
      const h = el("h" + lvl, { id, class: q ? "q" : null }, ...inline(text));
      if (lvl === 2) toc.push({ id, text });
      root.append(h); i++; continue;
    }
    if (line.startsWith("> ")) {
      flush(); const buf = [];
      while (i < lines.length && lines[i].startsWith(">")) buf.push(lines[i++].replace(/^>\s?/, ""));
      const text = buf.join(" ");
      const kind = (CALLS.find(([k]) => text.startsWith("**" + k + "**")) || [, "note"])[1];
      root.append(el("div", { class: "call " + kind }, ...inline(text))); continue;
    }
    if (line.startsWith("|") && i + 1 < lines.length && /^\|?\s*:?-{2,}/.test(lines[i + 1])) {
      flush(); const head = cells(line); i += 2; const rows = [];
      while (i < lines.length && lines[i].trim().startsWith("|")) rows.push(cells(lines[i++]));
      root.append(el("div", { class: "tbl" }, el("table", {},
        el("thead", {}, el("tr", {}, head.map(h => el("th", {}, ...inline(h))))),
        el("tbody", {}, rows.map(r => el("tr", {}, r.map(c => el("td", {}, ...inline(c)))))))));
      continue;
    }
    if (/^[-*] /.test(line) || /^\d+\. /.test(line)) {
      flush(); const ordered = /^\d+\. /.test(line), list = el(ordered ? "ol" : "ul");
      let li = null, sub = null;
      while (i < lines.length) {
        const l = lines[i];
        if (ordered ? /^\d+\. /.test(l) : /^[-*] /.test(l)) {
          li = el("li", {}, ...inline(l.replace(/^(\d+\.|[-*]) /, ""))); sub = null; list.append(li); i++;
        } else if (li && (m = l.match(/^\s{2,}[-*] (.*)$/))) {
          if (!sub) { sub = el("ul"); li.append(sub); }
          sub.append(el("li", {}, ...inline(m[1]))); i++;
        } else if (li && /^\s{2,}\S/.test(l) && !isBlockStart(l.trim())) {
          (sub ? sub.lastChild : li).append(" ", ...inline(l.trim())); i++;
        } else break;
      }
      root.append(list); continue;
    }
    para.push(line.trim()); i++;
    if (i < lines.length && isBlockStart(lines[i])) flush();
  }
  flush();
  return { root, toc };
}

// ---- Page state ----
let MAN = { levels: [] };
const cache = {};
function doneSet() { try { return new Set(JSON.parse(localStorage.getItem("sdp-mastery-done") || "[]")); } catch { return new Set(); } }
function setDone(id, on) {
  const s = doneSet(); on ? s.add(id) : s.delete(id);
  try { localStorage.setItem("sdp-mastery-done", JSON.stringify([...s])); } catch {}
}
const allTopics = () => MAN.levels.flatMap(l => l.topics.map(t => ({ ...t, level: l })));
function currentId() {
  const h = decodeURIComponent(location.hash.slice(1)).split("/")[0];
  const ts = allTopics();
  return (ts.find(t => t.id === h) || ts[0] || {}).id;
}

function renderSide() {
  const cur = currentId(), done = doneSet();
  $("side").replaceChildren(...MAN.levels.map(l => {
    const n = l.topics.filter(t => done.has(t.id)).length;
    return el("section", {},
      el("h2", { class: "lvl-h" }, el("b", {}, "Level " + l.level), el("span", {}, l.title)),
      el("p", { class: "lvl-blurb" }, l.blurb),
      el("div", { class: "prog", role: "progressbar", "aria-valuemin": 0, "aria-valuemax": l.topics.length, "aria-valuenow": n, "aria-label": `Level ${l.level} progress` },
        el("div", { style: `width:${l.topics.length ? n / l.topics.length * 100 : 0}%` })),
      el("div", { class: "prog-t" }, `${n} of ${l.topics.length} topics done`),
      l.topics.map(t => el("button", { class: "topic", "aria-current": t.id === cur ? "true" : null, onclick: () => go(t.id) },
        el("span", { class: "ic", "aria-hidden": "true" }, t.icon), el("span", { class: "nm" }, t.title),
        el("span", { class: "ok", "aria-label": done.has(t.id) ? "done" : null }, done.has(t.id) ? "✓" : ""))));
  }), el("p", { class: "soon" }, "More levels coming soon."));
}

let toDoc = false;
const narrow = () => matchMedia("(max-width: 900px)").matches;
function scrollToStart() { if (toDoc && narrow()) $("doc").scrollIntoView(); else window.scrollTo({ top: 0 }); toDoc = false; }
function go(id) {
  toDoc = true;
  if (currentId() === id && location.hash) { scrollToStart(); return; }
  location.hash = id;
}

async function renderDoc() {
  const id = currentId(), ts = allTopics(), idx = ts.findIndex(t => t.id === id), t = ts[idx], doc = $("doc");
  renderSide();
  if (!t) { doc.replaceChildren(el("div", { class: "empty" }, "No topics yet.")); return; }
  document.title = `${t.title} · Mastery · 60 Day Prep`;
  if (!cache[id]) {
    doc.replaceChildren(el("div", { class: "empty" }, "Loading notes…"));
    try {
      const r = await fetch("/mastery/" + t.file, { cache: "no-cache" });
      if (!r.ok) throw new Error(r.status === 404 ? "These notes aren't written yet." : "Couldn't load the notes (" + r.status + ").");
      cache[id] = await r.text();
    } catch (e) { doc.replaceChildren(el("div", { class: "empty" }, e.message || "Couldn't load the notes.")); return; }
    if (currentId() !== id) return;
  }
  const src = cache[id], words = src.split(/\s+/).filter(Boolean).length;
  const { root, toc } = renderMarkdown(src);
  const done = doneSet().has(id);
  const prev = ts[idx - 1], next = ts[idx + 1];
  doc.replaceChildren(
    el("div", { class: "doc-top" },
      el("div", {},
        el("div", { class: "eyebrow" }, `Level ${t.level.level} · ${t.level.title}`),
        el("h1", {}, t.icon + " ", el("span", { class: "tt" }, t.title)),
        el("p", { class: "sum" }, t.summary)),
      el("button", { class: "done-btn", "aria-pressed": done ? "true" : "false", onclick: () => { setDone(id, !doneSet().has(id)); renderDoc(); } },
        done ? "✓ Done" : "Mark as done")),
    el("div", { class: "meta-row" }, el("span", {}, `~${Math.max(1, Math.round(words / 200))} min read`), el("span", {}, `${toc.length} sections`)),
    toc.length ? el("nav", { class: "toc", "aria-label": "On this page" }, el("b", {}, "On this page"),
      el("ol", {}, toc.map(s => el("li", {}, el("a", { href: "#" + id + "/" + s.id, onclick: e => { e.preventDefault(); jump(s.id); } }, ...inline(s.text)))))) : null,
    root,
    el("div", { class: "pager" },
      prev ? el("button", { onclick: () => go(prev.id) }, el("small", {}, "← Previous"), prev.title) : null,
      next ? el("button", { class: "nx", onclick: () => go(next.id) }, el("small", {}, "Next →"), next.title) : null));
  const sec = decodeURIComponent(location.hash.slice(1)).split("/")[1];
  if (sec) { toDoc = false; requestAnimationFrame(() => jump(sec, true)); } else scrollToStart();
}
function jump(sec, noPush) {
  const target = document.getElementById(sec); if (!target) return;
  if (!noPush) history.replaceState(null, "", "#" + currentId() + "/" + sec);
  target.scrollIntoView({ behavior: noPush ? "auto" : "smooth", block: "start" });
}

window.addEventListener("hashchange", renderDoc);
window.addEventListener("scroll", () => { $("toTop").hidden = window.scrollY < 800; }, { passive: true });
$("toTop").addEventListener("click", () => window.scrollTo({ top: 0, behavior: "smooth" }));

fetch("/mastery/index.json", { cache: "no-cache" }).then(r => r.json()).then(m => { MAN = m; renderDoc(); })
  .catch(() => { $("doc").replaceChildren(el("div", { class: "empty" }, "Couldn't load the topic list. Refresh to try again.")); });
</script>
</body>
